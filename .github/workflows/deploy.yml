name: Deploy to Cloudflare

# Auto-deploy: every push to main builds the app and ships it to the
# equine-registry-live Worker. Keeps Cloudflare in sync with GitHub (the
# single source of truth) without manual deploys.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build (validators + vite + minify + dist asset validation)
        run: npm run build

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy -c wrangler.deploy.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify live health
        run: |
          sleep 8
          curl -sf "https://equine-registry-live.rogerfires10.workers.dev/api/health" | head -c 400
          echo ""
          echo "Deploy verification complete."

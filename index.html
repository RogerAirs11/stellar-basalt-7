<html lang="fa" dir="rtl">

    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <meta name="theme-color" content="#0b0f0e" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/assets/fallbacks/registry-mark.svg" />
    <!-- R148: original webfonts were absent from the supplied archive.
         This local stylesheet uses installed/system fallbacks without remote requests. -->
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <title>Horse Registry</title>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/web/main.tsx"></script>
